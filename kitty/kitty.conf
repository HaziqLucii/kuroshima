# Kuro 黒 — Swiss-brutalist techwear.
# Hues collapse to a grey ramp: emphasis survives as lightness, not colour.

# niri's own environment has SHELL=/usr/bin/zsh (not the account's real
# login shell), and kitty's default `shell .` just inherits that - so
# without this, every kitty window launches zsh instead of fish, silently
# dropping the `y` function and fastfetch's own default greeting.
shell fish

# 0 = never ask. Default asks whenever a foreground process (yazi, an
# editor, anything not the bare shell) is still running in the window,
# which was every single time exiting yazi via Mod+E.
confirm_os_window_close 0

font_family      JetBrainsMono Nerd Font Mono
font_size        11.0
symbol_map U+3000-U+30FF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

window_padding_width      10
window_border_width       1px
active_border_color       #ffffff
inactive_border_color     #232323
hide_window_decorations   no
cursor_shape              block
cursor_blink_interval     0
scrollback_lines          10000
enable_audio_bell         no

background   #050506
foreground   #ededed
cursor       #ffffff
selection_background #ffffff
selection_foreground #000000
url_color            #ffffff

color0  #090909
color8  #4c4c4c
color1  #d2d2d2
color9  #f5f5f5
color2  #a8a8a8
color10 #cecece
color3  #c4c4c4
color11 #e6e6e6
color4  #b4b4b4
color12 #d6d6d6
color5  #9e9e9e
color13 #c6c6c6
color6  #bcbcbc
color14 #dcdcdc
color7  #ececec
color15 #ffffff
