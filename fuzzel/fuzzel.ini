# Kuro-matched fuzzel theme, bundled with kuroshima so installing the
# island also gets you the launcher styled to match it (bone-on-black,
# sharp corners, no accent hue - same tokens as theme/Theme.qml).
#
# Hierarchy comes from ink brightness, not colour, matching this whole
# project's own "no accent hue" rule: resting text is dim, the matched
# substring and the input line are full-bright ink, and the selected row
# fully inverts (bone background, near-black text) - the exact same
# "bone-on-black hover/active" treatment already built into the expanded
# dashboard's TOGGLES/workspace pills/media controls.
#
# "//kuro." as the prompt (not a message header): sits directly where the
# default "> " would be, left of typed text - reads as a signature, not a
# label taking up its own line.

font=JetBrainsMono Nerd Font:size=11
# Quoted: trailing spaces are trimmed unless quoted, and the space after
# "kuro." is what visually separates it from typed text.
prompt="//kuro. "

[colors]
background=050506ff
text=8f8f8fff
match=edededff
input=edededff
placeholder=5c5c5cff
prompt=edededff
selection=edededff
selection-text=050506ff
selection-match=3a3a3aff
border=232323ff

[border]
width=1
radius=0
selection-radius=0
